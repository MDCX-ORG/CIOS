# CIOS seed operations data — architect pre-work for PRMT-165 (L93 Path B / L94 feature/m3-model)
# EXT has NO ops data (L93 §5): tickets/PM/spares/inspections/alarms are SYNTHESIZED to the
# spec-008 field shapes + spec-003 enums. Every asset_path below exists in seed/assets.yaml.
# Keys are snake_case mirrors (SeedAlarm/SeedSpare/SeedTicket/SeedPM/SeedInspection per PRMT-165 §4).
# Enums: severity ∈ {critical,major,minor,info} (spec-003 §2); alarm state ∈ {firing,acked,resolved}
# (core.Alarm); ticket state ∈ {open,acknowledged,resolved,closed} (spec-008 §2).
# Dates anchored around 2026-07-01.

